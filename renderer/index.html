<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge</title>
    <style>
      body {
        background-color: #0a0a0a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      #root {
        text-align: center;
        width: 100%;
      }
      .loading-splash {
        font-size: 1.5rem;
        color: #00f2fe;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.5; }
        50% { opacity: 1; }
        100% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-splash">⬡ Initializing Forge...</div>
    </div>
    <script nonce="${nonce}">
      window.vscode = acquireVsCodeApi();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
